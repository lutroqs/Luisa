<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Escritório da Luisa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6B3B47">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Layout: barra lateral fixa no computador, faixa de abas no celular; conteúdo em painéis sobre papel creme */
:root{
  --bg:#F2EEE8; --panel:#FFFDF9; --panel2:#F7F2EB; --ink:#2A2225; --muted:#76696C; --line:#E2D9CF;
  --wine:#6B3B47; --wine-ink:#FFFFFF; --wine-soft:#EFE2E5; --sage:#9DA58A; --sage-soft:#E6E9DD;
  --pink:#F6D6DE; --blue:#D6E2F3; --green:#DDEBD8; --yellow:#FFF0B8; --lilac:#EADCF5; --white:#FFFFFF;
  --ok-bg:#DCEFD9; --ok:#2E6B38; --warn-bg:#FFEDB3; --warn:#7E5E00; --bad-bg:#F8D3CF; --bad:#9B2C2C;
  --node-ink:#2A2225; --shadow:0 1px 2px rgba(70,40,45,.06),0 4px 14px rgba(70,40,45,.07);
  --paper:#FFFDF8;
  --font:Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1719; --panel:#262022; --panel2:#2E2729; --ink:#F1EAEC; --muted:#B3A6A9; --line:#3E3437;
  --wine:#C98A9A; --wine-ink:#1C1719; --wine-soft:#3D2A30; --sage:#AEB69A; --sage-soft:#2F332A;
  --ok-bg:#24402A; --ok:#A8DDB0; --warn-bg:#4A3E15; --warn:#F2D27A; --bad-bg:#4C2523; --bad:#F4AFA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1719; --panel:#262022; --panel2:#2E2729; --ink:#F1EAEC; --muted:#B3A6A9; --line:#3E3437;
  --wine:#C98A9A; --wine-ink:#1C1719; --wine-soft:#3D2A30; --sage:#AEB69A; --sage-soft:#2F332A;
  --ok-bg:#24402A; --ok:#A8DDB0; --warn-bg:#4A3E15; --warn:#F2D27A; --bad-bg:#4C2523; --bad:#F4AFA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.65rem;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;color:var(--wine);font-weight:400}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.tip a,.panel a:not(.btn){color:var(--wine);font-weight:700}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* LOGIN */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.login-box h1{font-size:1.9rem}
.vpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vpick label{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:grid;gap:4px;font-size:.85rem}
.vpick input{position:absolute;opacity:0}
.vpick label:has(input:checked){border-color:var(--wine);background:var(--wine-soft)}
.vpick b{font-size:.95rem}

/* APP SHELL */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
#nav{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 10px 14px;display:grid;gap:2px}
.brand b{font-size:1.1rem}
.brand span{font-size:.75rem;color:var(--muted)}
.nav-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);font-size:.92rem}
.nav-btn:hover{background:var(--panel2)}
.nav-btn[aria-current="true"]{background:var(--wine);color:var(--wine-ink);font-weight:700}
.nav-btn .ic{width:22px;text-align:center}
.nav-foot{margin-top:auto;padding:12px 10px 0;display:grid;gap:8px}
main{min-width:0;padding-block:24px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .sub{color:var(--muted);font-style:italic;margin-top:4px}
.badge-v{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--sage-soft);color:var(--ink);border:1px solid var(--line)}

/* COMPONENTS */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
a.btn{text-decoration:none;color:inherit}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--wine);color:var(--wine-ink);border-color:var(--wine);font-weight:700}
.btn.sm{padding:4px 8px;font-size:.8rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn.on{background:var(--wine-soft);border-color:var(--wine)}
.btn.danger{color:var(--bad)}
input[type=text],input[type=password],input[type=date],input[type=email],input[type=number],input[type=time],input:not([type]),select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;font-size:.92rem;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f input,label.f textarea,label.f select{font-weight:400;color:var(--ink)}
input[type=range]{accent-color:var(--wine)}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700}
.form{display:grid;gap:10px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .neu{background:var(--panel2);color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;cursor:pointer}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--wine);margin-top:1px;flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;font-size:.9rem;padding:6px 2px}
.banner{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--wine-soft);border:1px solid var(--line)}
.banner.party{background:linear-gradient(90deg,var(--pink),var(--yellow),var(--blue));color:#2A2225}
.tip{background:var(--sage-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine);border-radius:9px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.copybox{white-space:pre-wrap;font-size:.86rem;background:var(--panel2);border-radius:10px;padding:10px 12px;max-height:160px;overflow:auto}

/* KANBAN */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;min-width:min-content}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--wine)}
.col header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col header b{cursor:pointer}
.card{background:var(--panel);border-radius:10px;padding:10px 12px 8px;box-shadow:var(--shadow);cursor:pointer;display:grid;gap:6px;border:1px solid var(--line)}
.card .tag{display:block;width:34px;height:5px;border-radius:5px;background:var(--tag)}
.card .ct{font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--muted)}
.card .due.late{color:var(--bad);font-weight:700} .card .due.today{color:var(--warn);font-weight:700}
.card .mv{display:flex;justify-content:space-between}
.card .mv button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px}
.card .mv button:hover{background:var(--panel2)}
.add-card{display:grid;gap:6px}
.add-card input[name=t]{background:transparent;border-style:dashed}
.add-card .add-more{display:flex;gap:6px}.add-card .add-more input{flex:1}
.add-card:has(input[name=t]:placeholder-shown):not(:focus-within) .add-more{display:none}
.day .ev.m{background:var(--blue);color:#2A2225}
.day.drop{outline:2px dashed var(--wine)}
.item[draggable=true]{cursor:grab}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--ink)}
.stk-pick{display:flex;flex-wrap:wrap;gap:4px}
.stk-pick button{font-size:1.2rem;border:1px solid transparent;background:none;border-radius:8px;padding:2px 5px;cursor:pointer}
.stk-pick button.on{border-color:var(--wine);background:var(--wine-soft)}

/* FOCO */
.timer{font-size:clamp(3.2rem,12vw,5.5rem);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em;color:var(--wine)}
#pill{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wine);color:var(--wine-ink);border-radius:99px;padding:9px 16px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);cursor:pointer;z-index:40;border:0}

/* CONSTÂNCIA */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.75rem;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td input{width:70px;padding:6px 8px}
td.done-cell{background:var(--yellow)}
:root[data-theme="dark"] td.done-cell{background:var(--warn-bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) td.done-cell{background:var(--warn-bg)}}

/* CALENDÁRIO */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:.72rem;color:var(--muted);font-weight:700;text-align:center;padding:4px}
.day{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;font-size:.72rem}
.day.out{opacity:.4}
.day.today{border:2px solid var(--wine)}
.day.vac{background:var(--sage-soft)}
.day.sel{outline:2px solid var(--wine)}
.day .n{font-weight:700;font-size:.8rem}
.day .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:1px 4px;background:var(--wine-soft)}
.day .ev.d{background:var(--bad-bg);color:var(--bad)}
@media (max-width:560px){.day{min-height:50px}.day .ev{font-size:0;padding:0;height:5px}}

/* MAPAS */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
:root[data-theme="dark"] .gwrap{background-color:var(--panel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gwrap{background-color:var(--panel)}}
#gsvg{display:block;width:100%;min-width:820px;height:auto;touch-action:pan-x pan-y;user-select:none}
#gsvg .nd{cursor:grab;touch-action:none}
#gsvg text{font-family:var(--font);font-size:13px;fill:var(--node-ink);pointer-events:none}
#gsvg .el{stroke:var(--muted);stroke-width:2;fill:none}
#gsvg .el.sel{stroke:var(--wine);stroke-width:3}
#gsvg .elt{font-size:12px;font-weight:700;fill:var(--wine)}
#gsvg .shape{stroke:#00000022;stroke-width:1.5}
#gsvg .nd.sel .shape{stroke:var(--wine);stroke-width:3}
#gsvg .nd.from .shape{stroke:#2E6B38;stroke-width:3;stroke-dasharray:5 3}

/* RABISCOS */
.canvas-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FFFDF8}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.tool-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stk-tray{display:flex;flex-wrap:wrap;gap:4px}
.stk-tray button{font-size:1.4rem;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:2px}
.stk-tray button.on{border-color:var(--wine);background:var(--wine-soft)}
.stk-tray img{max-width:34px;max-height:34px}

/* CARREIRA */
.trail{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:grid;gap:8px;align-content:start}
.stage.cur{border:2px solid var(--wine)}
.stage h3{display:flex;justify-content:space-between;gap:6px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:90vw}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #nav{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px));z-index:30;gap:4px;align-items:center}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--panel)}
  .brand,.nav-foot{display:none}
  .nav-btn{flex:none;width:auto;padding:8px 10px;font-size:.82rem;white-space:nowrap}
  main{padding-top:16px}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<section id="login" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <div>
      <p class="eyebrow">escritório virtual</p>
      <h1 id="loginTitle">Oi, <em>Luisa</em></h1>
      <p class="muted" id="loginSub">Digite sua senha para entrar.</p>
    </div>
    <div id="loginNew" class="form" hidden>
      <label class="f" for="lgName">Seu nome
        <input id="lgName" type="text" value="Luisa"></label>
      <label class="f" for="lgBday">Seu aniversário
        <input id="lgBday" type="date"></label>
    </div>
    <input type="text" name="username" autocomplete="username" value="luisa" hidden>
    <label class="f" for="lgPass">Senha
      <input id="lgPass" type="password" autocomplete="current-password" required minlength="4"></label>
    <label class="f" for="lgPass2" id="lgPass2Wrap" hidden>Repita a senha
      <input id="lgPass2" type="password" autocomplete="new-password"></label>
    <div>
      <p class="eyebrow" style="margin-bottom:6px">Qual escritório abrir?</p>
      <div class="vpick">
        <label><input type="radio" name="ver" value="ciee"><b>Versão CIEE</b><span class="muted">Estágio: supervisor, relatórios, recesso, jornada de 6h.</span></label>
        <label><input type="radio" name="ver" value="empresa" checked><b>Minha versão</b><span class="muted">Qualquer empresa e cargo. Tudo editável.</span></label>
      </div>
    </div>
    <p id="loginErr" class="pill bad" hidden></p>
    <button class="btn pri" type="submit" id="loginBtn">Entrar</button>
    <button class="btn ghost sm" type="button" id="forgotBtn">Esqueci a senha</button>
    <div id="forgotBox" class="form" hidden>
      <p class="muted" style="font-size:.85rem">Para criar uma senha nova, confirme a data do seu aniversário cadastrada. Seus dados continuam salvos.</p>
      <input id="fgBday" type="date" aria-label="Data do aniversário">
      <button class="btn" type="button" id="fgGo">Confirmar e criar nova senha</button>
      <button class="btn sm danger" type="button" id="fgWipe">Não lembro: apagar tudo e começar de novo</button>
    </div>
  </form>
</section>

<div id="app" hidden>
  <nav id="nav" aria-label="Seções"></nav>
  <main id="view"></main>
</div>
<button id="pill" hidden type="button"></button>
<div id="toast" hidden role="status"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ========== utilidades ========== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=s=>s?parse(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.',''):'';
const fmtL=s=>s?parse(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}):'';
const enc=encodeURIComponent;
const MEM={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?(MEM[k]??null):JSON.parse(v)}catch(e){return MEM[k]??null}},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Não consegui salvar no navegador. Faça um backup em Ajustes.')}},
  del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}
};
const sget=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const sset=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
async function hash(p){const s='lu-office::'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}
function copy(text,btn){const done=()=>{toast('Copiado');};try{navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text))}catch(e){fallbackCopy(text)}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('Selecione o texto e copie')}ta.remove()}

function suggest(title){const t=(title||'').toLowerCase();

 if(/e-?mail|responder|retorno/.test(t))return['Ler e entender o pedido','Responder em até 24h','Marcar follow-up'];

function bdayInfo(){if(!META.birthday)return null;const[y,m,d]=META.birthday.split('-').map(Number);const now=parse(today());
 let n=new Date(now.getFullYear(),m-1,d);if(n<now)n=new Date(now.getFullYear()+1,m-1,d);return{days:diff(today(),iso(n)),age:n.getFullYear()-y,date:iso(n)}}
const isBday=()=>{const b=bdayInfo();return b&&b.days===0};
function allDue(){const last=S.cols.length-1;return[
 ...S.deadlines.filter(d=>!d.done&&d.date).map(d=>({t:d.title,date:d.date,who:d.who,src:'Prazo'})),
 ...S.cards.filter(c=>c.col<last&&c.due).map(c=>({t:c.title,date:c.due,who:c.who,src:S.cols[c.col]}))].sort((a,b)=>a.date.localeCompare(b.date))}
function dueCls(d){if(!d)return'';const x=diff(today(),d);return x<0?'late':x===0?'today':''}
function dueTxt(d){const x=diff(today(),d);return x<0?`atrasado ${-x}d`:x===0?'hoje':x===1?'amanhã':`em ${x} dias`}
function duePill(d){const x=diff(today(),d);return`<span class="pill ${x<0?'bad':x<=1?'warn':'neu'}">${dueTxt(d)}</span>`}
function weekStats(){const f=S.weeks.map(w=>({p:+w.p||0,d:+w.d||0})).filter(w=>w.p>0);const pc=f.map(w=>Math.round(w.d/w.p*100));
 return{avg:pc.length?Math.round(pc.reduce((a,b)=>a+b,0)/pc.length):null,above:pc.filter(x=>x>=70).length,filled:f.length}}
function faixa(p){return p>=70?['ok','Seguindo']:p>=40?['warn','Ajustar dose']:['bad','Replanejar']}

/* FOCO */
const T={len:25,left:1500,run:false,task:'',iv:null};
function mmss(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function tick(){if(!T.run)return;T.left--;if(T.left<=0){T.run=false;clearInterval(T.iv);S.focus.min+=T.len;S.focus.total=(S.focus.total||0)+T.len;save();beep();
 try{if(window.Notification&&Notification.permission==='granted')new Notification('Bloco de foco concluído',{body:'Levanta, bebe água, alonga 5 minutos.'})}catch(e){}
 toast('Bloco concluído! Pausa de 5 min.');T.left=T.len*60;if(cur==='foco'||cur==='painel')render()}
 const b=$('#timerBig');if(b)b.textContent=mmss(T.left);updatePill()}
function updatePill(){const p=$('#pill');p.hidden=!T.run||cur==='foco'||$('#app').hidden;p.textContent='🎯 '+mmss(T.left)+(T.task?' · '+T.task.slice(0,22):'')}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.22);o.start(a.currentTime+t);o.stop(a.currentTime+t+.23)})}catch(e){}}

const CAL={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
const AG={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
function monthGrid(st,evFn,act,vacFn){const first=new Date(st.y,st.m,1),start=new Date(first);start.setDate(1-first.getDay());const t=today();const cells=[];
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),ev=evFn(ds);
 cells.push(`<div class="day ${d.getMonth()!==st.m?'out':''} ${ds===t?'today':''} ${vacFn&&vacFn(ds)?'vac':''} ${ds===st.sel?'sel':''}" data-act="${act}Sel" data-d="${ds}" role="button" tabindex="0" aria-label="${fmtL(ds)}"><span class="n">${d.getDate()}</span>${ev.slice(0,3).map(e=>`<span class="ev ${e.c}">${esc(e.t)}</span>`).join('')}${ev.length>3?`<span class="muted">+${ev.length-3}</span>`:''}</div>`)}
 return`<div class="row" style="justify-content:space-between"><button class="btn sm" data-act="${act}Nav" data-d="-1" aria-label="Mês anterior">◀</button><h2 style="text-transform:capitalize">${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><div class="row"><button class="btn sm" data-act="${act}Today">Hoje</button><button class="btn sm" data-act="${act}Nav" data-d="1" aria-label="Próximo mês">▶</button></div></div>
 <div class="cal">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells.join('')}</div>`}
function taskEvents(ds){const last=S.cols.length-1,ev=[];
 S.deadlines.filter(d=>!d.done&&d.date===ds).forEach(d=>ev.push({c:'d',t:'⏰ '+d.title}));
 S.cards.filter(c=>c.due===ds).forEach(c=>ev.push({c:c.col===last?'':'d',t:(c.col===last?'✓ ':'')+c.title}));return ev}
const isVac=ds=>S.vacations.some(v=>ds>=v.start&&ds<=v.end);
const byTime=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'99').localeCompare(b.start||'99');
function agendaEvents(ds){const ev=[];
 S.meetings.filter(m=>m.date===ds).sort(byTime).forEach(m=>ev.push({c:'m',t:(m.start?m.start+' ':'')+m.title}));
 S.people.filter(p=>p.next===ds).forEach(p=>ev.push({c:'',t:'💬 '+p.name}));
 if(META.birthday&&META.birthday.slice(5)===ds.slice(5))ev.push({c:'',t:'🎂 Meu aniversário'});
 S.vacations.filter(v=>ds>=v.start&&ds<=v.end).forEach(v=>ev.push({c:'',t:'🏖️ '+v.type}));return ev}
function gcal(m){const d=m.date.replaceAll('-','');let dates;
 if(m.start){const plus=x=>{const[h,mi]=x.split(':').map(Number);return pad(Math.min(23,h+1))+':'+pad(mi)};dates=`${d}T${m.start.replace(':','')}00/${d}T${(m.end||plus(m.start)).replace(':','')}00`}
 else dates=`${d}/${addDays(m.date,1).replaceAll('-','')}`;
 return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(m.title)}&dates=${dates}&ctz=America/Sao_Paulo&details=${enc((m.who?'Com: '+m.who+'\n':'')+(m.notes||''))}&location=${enc(m.place||'')}`}

const G={tab:'mind',sel:null,selE:null,link:false,from:null,drag:null};
function wrapTxt(t,n){const w=String(t).split(/\s+/),L=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n&&l){L.push(l);l=x}else l=(l+' '+x).trim()});if(l)L.push(l);return L.length?L:['']}
function geo(n){const L=wrapTxt(n.text,n.shape==='diamond'?18:22);let w=Math.min(250,Math.max(110,Math.max(...L.map(l=>l.length))*7.6+30)),h=L.length*17+22;if(n.shape==='diamond'){w*=1.4;h*=1.7}return{L,w,h}}
function edgePt(n,tx,ty){const{w,h}=geo(n),dx=tx-n.x,dy=ty-n.y;if(!dx&&!dy)return[n.x,n.y];const s=Math.min((w/2)/Math.abs(dx||1e-9),(h/2)/Math.abs(dy||1e-9));return[n.x+dx*s,n.y+dy*s]}
function graphInner(){const g=S[G.tab],M={};g.nodes.forEach(n=>M[n.id]=n);const arrow=G.tab==='flow';
 const E=g.edges.map((e,i)=>{const a=M[e.a],b=M[e.b];if(!a||!b)return'';const[x1,y1]=edgePt(a,b.x,b.y),[x2,y2]=edgePt(b,a.x,a.y);
 return`<g data-e="${i}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="14"/><line class="el ${G.selE===i?'sel':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${arrow?'marker-end="url(#ar)"':''}/>${e.label?`<text class="elt" x="${(x1+x2)/2+6}" y="${(y1+y2)/2-6}">${esc(e.label)}</text>`:''}</g>`}).join('');
 const N=g.nodes.map(n=>{const{L,w,h}=geo(n);let sh;
 if(n.shape==='diamond')sh=`<polygon class="shape" points="${n.x},${n.y-h/2} ${n.x+w/2},${n.y} ${n.x},${n.y+h/2} ${n.x-w/2},${n.y}" fill="${n.color}"/>`;
 else if(n.shape==='oval')sh=`<ellipse class="shape" cx="${n.x}" cy="${n.y}" rx="${w/2+8}" ry="${h/2+4}" fill="${n.color}"/>`;
 else sh=`<rect class="shape" x="${n.x-w/2}" y="${n.y-h/2}" width="${w}" height="${h}" rx="${n.shape==='pill'?h/2:8}" fill="${n.color}"/>`;
 return`<g class="nd ${G.sel===n.id?'sel':''} ${G.from===n.id?'from':''}" data-n="${n.id}">${sh}${L.map((l,i)=>`<text x="${n.x}" y="${n.y-(L.length-1)*8.5+i*17+4.5}" text-anchor="middle">${esc(l)}</text>`).join('')}</g>`}).join('');
 return`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76696C"/></marker></defs>${E}${N}`}
function drawG(){const s=$('#gsvg');if(s)s.innerHTML=graphInner()}

  if(nEl){const id=nEl.dataset.n;e.preventDefault();

   G.sel=id;G.selE=null;const n=g.nodes.find(x=>x.id===id),p=pt(e);G.drag={id,ox:p.x-n.x,oy:p.y-n.y};s.setPointerCapture(e.pointerId);drawG()}

function editNode(){const n=S[G.tab].nodes.find(x=>x.id===G.sel);if(!n){toast('Selecione um item primeiro');return}

const PAPER='#FFFDF8';
AFTER.rabiscos=()=>{const cv=$('#cv'),x=cv.getContext('2d');x.fillStyle=PAPER;x.fillRect(0,0,cv.width,cv.height);
 if(S.doodle){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=S.doodle}
 const P=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 let svT;const persist=()=>{clearTimeout(svT);svT=setTimeout(()=>{try{S.doodle=cv.toDataURL('image/png');save()}catch(e){}},400)};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();const[px,py]=P(e);

   else{x.globalAlpha=1;x.font=`${40+D.size*3}px Arial, sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(D.stk,px,py);persist()}return}
  D.drawing=true;D.last=[px,py];cv.setPointerCapture(e.pointerId);dot(px,py)});
 const dot=(px,py)=>{style();x.beginPath();x.moveTo(px,py);x.lineTo(px+.1,py+.1);x.stroke()};

 cv.addEventListener('pointermove',e=>{if(!D.drawing)return;const[px,py]=P(e);style();x.beginPath();x.moveTo(...D.last);x.lineTo(px,py);x.stroke();D.last=[px,py]});

 ${s[2].map((x,j)=>`<label class="check ${S.career[i+'-'+j]?'done':''}"><input type="checkbox" data-ch="car" data-k="${i}-${j}" ${S.career[i+'-'+j]?'checked':''}><span>${x}</span></label>`).join('')}</section>`).join('')}</div>

 <div class="grid g3">${S.feedbacks.map((f,i)=>`<div class="form"><label class="f" for="fbP${i}">Onde<input id="fbP${i}" type="text" value="${esc(f.place)}" data-ch="fb" data-i="${i}" data-f="place"></label>
 <label class="f" for="fbS${i}">O que me disseram<textarea id="fbS${i}" data-ch="fb" data-i="${i}" data-f="said">${esc(f.said)}</textarea></label>
 <label class="f" for="fbR${i}">Padrão que eu vejo<textarea id="fbR${i}" data-ch="fb" data-i="${i}" data-f="pattern" placeholder="ex.: esquecia prazos verbais">${esc(f.pattern)}</textarea></label>
 <label class="f" for="fbA${i}">O que faço diferente agora<textarea id="fbA${i}" data-ch="fb" data-i="${i}" data-f="action" placeholder="ex.: todo pedido vira cartão com prazo">${esc(f.action)}</textarea></label></div>`).join('')}</div></section>

 <section class="panel"><div><h2>Check-out do <em>dia</em></h2><p class="muted" style="font-size:.85rem">2 minutos antes de fechar o notebook.</p></div>

 <label class="f" for="coE">Energia (1 a 5)<input id="coE" type="range" name="e" min="1" max="5" value="3"></label><button class="btn pri">Salvar check-out</button></form>
 ${S.checkouts.slice(0,4).map(c=>`<div class="item" style="font-size:.85rem;flex-direction:column;align-items:stretch"><small>${fmtL(c.date)} · energia ${c.e}/5</small><span>✅ ${esc(c.a)}</span>${c.b?`<span>⛔ ${esc(c.b)}</span>`:''}${c.c?`<span>➡️ ${esc(c.c)}</span>`:''}</div>`).join('')}</section></div>`};

 emCopy:()=>copy($('#emS').value+'\n\n'+$('#emB').value),

 bkLoad:()=>{try{const d=JSON.parse($('#bkIn').value);if(d.app!=='escritorio-luisa')throw 0;const pass=META.pass;META={...META,...d.meta,pass};if(d.ciee)store.set(VKEY('ciee'),d.ciee);if(d.empresa)store.set(VKEY('empresa'),d.empresa);store.set('lu-meta',META);load();applyTheme();render();toast('Backup restaurado')}catch(e){toast('Esse texto não é um backup válido do escritório')}},
 resetV:el=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Toque de novo para confirmar';return}S=defaults(META.mode);save();render();toast('Versão recomeçada')}
};
function mv(st,d){st.m+=d;if(st.m<0){st.m=11;st.y--}if(st.m>11){st.m=0;st.y++}render()}
function toToday(st){const n=new Date();st.y=n.getFullYear();st.m=n.getMonth();st.sel=today();render()}
function gAdd(shape){const g=S[G.tab];const base=g.nodes.find(n=>n.id===G.sel);const n={id:uid(),x:base?Math.min(940,base.x+(G.tab==='mind'?150:0)):500,y:base?Math.min(660,base.y+(G.tab==='mind'?90:110)):350,text:shape==='diamond'?'Pergunta?':G.tab==='mind'?'Nova ideia':'Nova etapa',shape,color:shape==='diamond'?'#FFF0B8':NODECOL[g.nodes.length%NODECOL.length]};
 g.nodes.push(n);if(base)g.edges.push({a:base.id,b:n.id});G.sel=n.id;save();render()}

 fTask:el=>{T.task=el.value;render()},
 bur:el=>{S.bur[el.dataset.k]=el.checked;save();render()},

 wStart:el=>{if(el.value){S.weekStart=el.value;save();render()}},
 wk:el=>{S.weeks[+el.dataset.i][el.dataset.f]=el.value;save()},

 em:el=>{EM[el.dataset.f]=el.value;const[s,b]=emailFill();if(el.dataset.f!=='to'&&el.dataset.f!=='from'){$('#emS').value=s;$('#emB').value=b}},
 car:el=>{S.career[el.dataset.k]=el.checked;save();render()},
 fb:el=>{S.feedbacks[+el.dataset.i][el.dataset.f]=el.value;save()},
 meta:el=>{META[el.dataset.f]=el.value;save();if(el.dataset.f==='name')nav()},
 mail:el=>{META.emails[+el.dataset.i]=el.value.trim();save()}
};

 addVac:f=>{if(f.e.value<f.s.value){toast('O fim precisa ser depois do início');return}S.vacations.push({id:uid(),start:f.s.value,end:f.e.value,type:f.t.value});S.vacations.sort((a,b)=>a.start.localeCompare(b.start));save();render();toast('Descanso planejado 🏖️')},

};

/* arrastar cartões */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card],[data-tcard]');if(c){dragId=c.dataset.card||c.dataset.tcard;try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}});
document.addEventListener('dragover',e=>{const dy=e.target.closest&&e.target.closest('.day[data-d]');if(dy&&dragId&&cur==='calendario'){e.preventDefault();document.querySelectorAll('.day.drop').forEach(x=>x!==dy&&x.classList.remove('drop'));dy.classList.add('drop');return}});
document.addEventListener('drop',e=>{const dy=e.target.closest&&e.target.closest('.day[data-d]');if(dy&&dragId&&cur==='calendario'){e.preventDefault();const c=S.cards.find(x=>x.id===dragId);if(c){c.due=dy.dataset.d;CAL.sel=c.due;save();toast('Agendada para '+fmt(c.due))}dragId=null;render()}});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&dragId){e.preventDefault();const c=S.cards.find(x=>x.id===dragId);if(c){c.col=+col.dataset.col;if(c.col===S.cols.length-1)toast('Entregue! 🎉');save()}dragId=null;render()}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over,.day.drop').forEach(x=>x.classList.remove('over'))});
$('#pill').onclick=()=>go('foco');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==cur&&!$('#app').hidden){cur=h;render()}});

/* ========== início ========== */
applyTheme();
if(META.pass&&sget('lu-auth')==='1')enter();else showLogin();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>

</body></html>
